<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BAS — Categories Manager</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f5f1e8;

    color: #202020;
}

header {

    background: #171717;

    color: white;

    padding:
        22px 5%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;
}

header h1 {

    margin: 0;

    font-size: 24px;
}

header p {

    margin: 4px 0 0;

    color: #cfcfcf;
}

.header-actions {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}

.header-actions a,
.header-actions button {

    padding:
        10px 16px;

    border:
        1px solid
        #c9a45c;

    background: transparent;

    color: white;

    text-decoration: none;

    cursor: pointer;

    font-size: 14px;
}

.header-actions button {

    background: #c9a45c;

    color: #171717;

    font-weight: bold;
}

main {

    max-width: 1250px;

    margin: auto;

    padding:
        45px 5%;
}

.top-title {

    margin-bottom: 30px;
}

.top-title h2 {

    margin:
        0 0 8px;

    font-size: 38px;
}

.top-title p {

    color: #666;

    margin: 0;
}

.form-card,
.list-card {

    background: white;

    border:
        1px solid
        #ddd5c8;

    padding: 30px;

    margin-bottom: 35px;
}

.form-card h3,
.list-card h3 {

    margin-top: 0;

    font-size: 25px;

    border-bottom:
        1px solid
        #e3ddd3;

    padding-bottom: 15px;
}

.form-mode {

    color: #9b7740;

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 18px;
}

.grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;
}

.full {

    grid-column:
        1 / -1;
}

label {

    display: block;

    font-weight: bold;

    margin-bottom: 7px;

    font-size: 14px;
}

input,
textarea {

    width: 100%;

    padding: 12px;

    border:
        1px solid
        #d5cec2;

    background: white;

    font-family: inherit;

    font-size: 14px;
}

textarea {

    min-height: 120px;

    resize: vertical;
}

input:focus,
textarea:focus {

    outline: none;

    border-color:
        #b38d4d;
}

.arabic {

    direction: rtl;

    text-align: right;
}

.image-area {

    display: flex;

    gap: 20px;

    align-items: flex-start;

    flex-wrap: wrap;
}

.image-preview {

    width: 190px;

    height: 140px;

    object-fit: cover;

    border:
        1px solid
        #ddd5c8;

    display: none;

    background: #eee;
}

.image-placeholder {

    width: 190px;

    height: 140px;

    background: #222;

    color: #c9a45c;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    font-weight: bold;
}

.image-info {

    flex: 1;

    min-width: 250px;
}

.current-image {

    margin-top: 10px;

    color: #777;

    font-size: 13px;
}

.buttons {

    display: flex;

    gap: 12px;

    margin-top: 25px;

    flex-wrap: wrap;
}

.primary-btn,
.secondary-btn,
.danger-btn {

    border: none;

    padding:
        13px 22px;

    cursor: pointer;

    font-weight: bold;

    font-size: 14px;
}

.primary-btn {

    background: #c9a45c;

    color: #171717;
}

.secondary-btn {

    background: #ddd6ca;

    color: #222;
}

.danger-btn {

    background: #9b2d2d;

    color: white;
}

.primary-btn:hover,
.secondary-btn:hover,
.danger-btn:hover {

    opacity: 0.85;
}

.status {

    margin-top: 15px;

    padding: 12px;

    display: none;
}

.success {

    display: block;

    background: #e5f2e8;

    color: #275b35;
}

.error {

    display: block;

    background: #f8e2e2;

    color: #8a2222;
}

.category-list {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;
}

.category-item {

    background: #222;

    color: white;

    border:
        1px solid
        #333;

    overflow: hidden;
}

.category-image {

    width: 100%;

    height: 180px;

    object-fit: cover;
}

.category-placeholder {

    height: 180px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 50px;

    font-weight: bold;

    color: #c9a45c;
}

.category-info {

    padding: 22px;
}

.category-order {

    color: #c9a45c;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 1px;
}

.category-info h4 {

    margin:
        8px 0;

    font-size: 22px;
}

.category-ar {

    direction: rtl;

    text-align: right;

    color: #ddd;

    font-size: 18px;

    margin-bottom: 12px;
}

.category-description {

    color: #bbb;

    font-size: 14px;

    line-height: 1.6;
}

.category-actions {

    display: flex;

    gap: 10px;

    margin-top: 18px;
}

.empty {

    padding: 30px;

    text-align: center;

    color: #777;
}

@media (max-width: 900px) {

    .category-list {

        grid-template-columns:
            repeat(2, 1fr);
    }

}

@media (max-width: 700px) {

    .grid,
    .category-list {

        grid-template-columns: 1fr;
    }

    .full {

        grid-column: auto;
    }

    header {

        flex-direction: column;

        align-items: flex-start;
    }

}

</style>

</head>


<body>


<header>

<div>

<h1>
BAS — Categories Manager
</h1>

<p>
Bashaer Science Magazine
</p>

</div>


<div class="header-actions">

<a href="/admin/dashboard.html">
Dashboard
</a>

<a href="/admin/articles.html">
Articles
</a>

<button onclick="logout()">
Logout
</button>

</div>

</header>


<main>


<div class="top-title">

<h2>
Science Categories
</h2>

<p>
Manage the scientific sections of BAS Science Magazine.
</p>

</div>


<section class="form-card">


<h3 id="formTitle">
Add New Category
</h3>


<div
id="formMode"
class="form-mode"
>
CREATE MODE
</div>


<form id="categoryForm">


<div class="grid">


<div>

<label>
English Name *
</label>

<input
type="text"
id="name_en"
required
>

</div>


<div>

<label>
Arabic Name *
</label>

<input
type="text"
id="name_ar"
class="arabic"
required
>

</div>


<div>

<label>
Slug *
</label>

<input
type="text"
id="slug"
placeholder="science-unlocked"
required
>

</div>


<div>

<label>
Display Order
</label>

<input
type="number"
id="display_order"
value="0"
>

</div>


<div>

<label>
English Description
</label>

<textarea
id="description_en"
></textarea>

</div>


<div>

<label>
Arabic Description
</label>

<textarea
id="description_ar"
class="arabic"
></textarea>

</div>


<div class="full">

<label>
Category Image
</label>


<div class="image-area">


<div>

<img
id="imagePreview"
class="image-preview"
alt="Category image"
>

<div
id="imagePlaceholder"
class="image-placeholder"
>
BAS
</div>

</div>


<div class="image-info">

<input
type="file"
id="imageFile"
accept="image/*"
>

<div
id="currentImage"
class="current-image"
></div>

</div>


</div>

</div>


</div>


<div class="buttons">

<button
type="submit"
class="primary-btn"
id="saveButton"
>
Save Category
</button>


<button
type="button"
class="secondary-btn"
onclick="resetForm()"
>
Clear / New Category
</button>

</div>


<div
id="statusMessage"
class="status"
></div>


</form>


</section>


<section class="list-card">


<h3>
Existing Categories
</h3>


<div
id="categoryList"
class="category-list"
></div>


</section>


</main>


<script>


let editingId = null;

let currentImageUrl = "";


// ======================================
// AUTH
// ======================================

async function checkAuth() {

    const response =
        await fetch(
            "/api/auth"
        );

    const data =
        await response.json();

    if (!data.loggedIn) {

        window.location.href =
            "/admin/login.html";

    }

}


// ======================================
// LOGOUT
// ======================================

async function logout() {

    await fetch(
        "/api/logout",
        {
            method: "POST"
        }
    );

    window.location.href =
        "/admin/login.html";

}


// ======================================
// IMAGE PREVIEW
// ======================================

document
    .getElementById("imageFile")
    .addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file) {
                return;
            }

            const preview =
                document.getElementById(
                    "imagePreview"
                );

            const placeholder =
                document.getElementById(
                    "imagePlaceholder"
                );

            preview.src =
                URL.createObjectURL(file);

            preview.style.display =
                "block";

            placeholder.style.display =
                "none";

        }
    );


// ======================================
// UPLOAD IMAGE
// ======================================

async function uploadImage() {

    const fileInput =
        document.getElementById(
            "imageFile"
        );

    if (!fileInput.files.length) {

        return currentImageUrl || "";

    }

    const formData =
        new FormData();

    formData.append(
        "file",
        fileInput.files[0]
    );

    const response =
        await fetch(
            "/api/upload",
            {
                method: "POST",
                body: formData
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        throw new Error(
            data.message ||
            "Image upload failed."
        );

    }

    return data.url;

}


// ======================================
// SAVE CATEGORY
// ======================================

document
    .getElementById("categoryForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const statusMessage =
                document.getElementById(
                    "statusMessage"
                );


            statusMessage.className =
                "status";

            statusMessage.textContent =
                "Saving...";


            try {

                const imageUrl =
                    await uploadImage();


                const categoryData = {

                    name_en:
                        document.getElementById(
                            "name_en"
                        ).value.trim(),

                    name_ar:
                        document.getElementById(
                            "name_ar"
                        ).value.trim(),

                    description_en:
                        document.getElementById(
                            "description_en"
                        ).value,

                    description_ar:
                        document.getElementById(
                            "description_ar"
                        ).value,

                    slug:
                        document.getElementById(
                            "slug"
                        ).value.trim(),

                    image:
                        imageUrl,

                    display_order:
                        document.getElementById(
                            "display_order"
                        ).value || 0

                };


                let response;


                if (editingId) {

                    response =
                        await fetch(
                            `/api/categories/${editingId}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        categoryData
                                    )
                            }
                        );

                }

                else {

                    response =
                        await fetch(
                            "/api/categories",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        categoryData
                                    )
                            }
                        );

                }


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not save category."
                    );

                }


                statusMessage.className =
                    "status success";

                statusMessage.textContent =
                    editingId
                        ? "Category updated successfully."
                        : "Category created successfully.";


                resetForm();

                loadCategories();

            }

            catch(error) {

                console.error(error);

                statusMessage.className =
                    "status error";

                statusMessage.textContent =
                    error.message;

            }

        }
    );


// ======================================
// LOAD CATEGORIES
// ======================================

async function loadCategories() {

    const response =
        await fetch(
            "/api/categories"
        );

    const categories =
        await response.json();


    const list =
        document.getElementById(
            "categoryList"
        );

    list.innerHTML = "";


    if (!categories.length) {

        list.innerHTML = `
            <div class="empty">
                No categories yet.
            </div>
        `;

        return;

    }


    categories
        .sort(
            (a, b) =>
                Number(a.display_order || 0) -
                Number(b.display_order || 0)
        )
        .forEach(
            category => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "category-item";


                const imageHTML =
                    category.image

                        ? `
                            <img
                                src="${category.image}"
                                class="category-image"
                                alt=""
                            >
                          `

                        : `
                            <div class="category-placeholder">
                                BAS
                            </div>
                          `;


                item.innerHTML = `

                    ${imageHTML}

                    <div class="category-info">

                        <div class="category-order">
                            SECTION #${escapeHtml(
                                category.display_order || 0
                            )}
                        </div>

                        <h4>
                            ${escapeHtml(
                                category.name_en || ""
                            )}
                        </h4>

                        <div class="category-ar">
                            ${escapeHtml(
                                category.name_ar || ""
                            )}
                        </div>

                        ${
                            category.description_en
                                ? `
                                    <div class="category-description">
                                        ${escapeHtml(
                                            category.description_en
                                        )}
                                    </div>
                                  `
                                : ""
                        }

                        <div class="category-actions">

                            <button
                                class="primary-btn"
                                onclick="editCategory(${category.id})"
                            >
                                Edit
                            </button>

                            <button
                                class="danger-btn"
                                onclick="deleteCategory(${category.id})"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                `;


                list.appendChild(item);

            }
        );

}


// ======================================
// EDIT CATEGORY
// ======================================

async function editCategory(id) {

    const response =
        await fetch(
            "/api/categories"
        );

    const categories =
        await response.json();


    const category =
        categories.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if (!category) {

        alert(
            "Category not found."
        );

        return;

    }


    editingId =
        category.id;


    currentImageUrl =
        category.image || "";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Category";


    document.getElementById(
        "formMode"
    ).textContent =
        `EDIT MODE — Category #${category.id}`;


    document.getElementById(
        "saveButton"
    ).textContent =
        "Update Category";


    document.getElementById(
        "name_en"
    ).value =
        category.name_en || "";


    document.getElementById(
        "name_ar"
    ).value =
        category.name_ar || "";


    document.getElementById(
        "slug"
    ).value =
        category.slug || "";


    document.getElementById(
        "description_en"
    ).value =
        category.description_en || "";


    document.getElementById(
        "description_ar"
    ).value =
        category.description_ar || "";


    document.getElementById(
        "display_order"
    ).value =
        category.display_order || 0;


    document.getElementById(
        "imageFile"
    ).value = "";


    const preview =
        document.getElementById(
            "imagePreview"
        );


    const placeholder =
        document.getElementById(
            "imagePlaceholder"
        );


    const currentImage =
        document.getElementById(
            "currentImage"
        );


    if (category.image) {

        preview.src =
            category.image;

        preview.style.display =
            "block";

        placeholder.style.display =
            "none";

        currentImage.textContent =
            "Current image will be kept unless you choose a new one.";

    }

    else {

        preview.style.display =
            "none";

        placeholder.style.display =
            "flex";

        currentImage.textContent =
            "No current image.";

    }


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ======================================
// DELETE CATEGORY
// ======================================

async function deleteCategory(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this category?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/categories/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Could not delete category."
            );

        }


        alert(
            "Category deleted successfully."
        );


        loadCategories();

    }

    catch(error) {

        alert(
            error.message
        );

    }

}


// ======================================
// RESET FORM
// ======================================

function resetForm() {

    editingId = null;

    currentImageUrl = "";


    document.getElementById(
        "categoryForm"
    ).reset();


    document.getElementById(
        "display_order"
    ).value = 0;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Add New Category";


    document.getElementById(
        "formMode"
    ).textContent =
        "CREATE MODE";


    document.getElementById(
        "saveButton"
    ).textContent =
        "Save Category";


    document.getElementById(
        "imagePreview"
    ).style.display =
        "none";


    document.getElementById(
        "imagePlaceholder"
    ).style.display =
        "flex";


    document.getElementById(
        "currentImage"
    ).textContent =
        "";


    document.getElementById(
        "statusMessage"
    ).className =
        "status";

}


// ======================================
// ESCAPE HTML
// ======================================

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


// ======================================
// START
// ======================================

async function start() {

    await checkAuth();

    await loadCategories();

}


start();


</script>


</body>

</html>
