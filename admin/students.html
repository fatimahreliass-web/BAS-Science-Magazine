<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BAS — Students Manager</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f1e8;

            color: #202020;
        }

        header {
            background: #171717;

            color: white;

            padding:
                22px
                5%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }

        header h1 {
            margin: 0;

            font-size: 24px;
        }

        header p {
            margin: 4px 0 0;

            color: #cfcfcf;
        }

        .header-actions {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .header-actions a,
        .header-actions button {

            padding:
                10px
                16px;

            border:
                1px solid
                #c9a45c;

            background: transparent;

            color: white;

            text-decoration: none;

            cursor: pointer;

            font-size: 14px;
        }

        .header-actions button {

            background: #c9a45c;

            color: #171717;

            font-weight: bold;
        }

        main {

            max-width: 1250px;

            margin: auto;

            padding:
                45px 5%;
        }

        .top-title {

            margin-bottom: 30px;
        }

        .top-title h2 {

            margin:
                0 0 8px;

            font-size: 38px;
        }

        .top-title p {

            color: #666;

            margin: 0;
        }

        .form-card,
        .list-card {

            background: white;

            border:
                1px solid
                #ddd5c8;

            padding: 30px;

            margin-bottom: 35px;
        }

        .form-card h3,
        .list-card h3 {

            margin-top: 0;

            font-size: 25px;

            border-bottom:
                1px solid
                #e3ddd3;

            padding-bottom: 15px;
        }

        .form-mode {

            color: #9b7740;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 18px;
        }

        .grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .full {

            grid-column:
                1 / -1;
        }

        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            font-size: 14px;
        }

        input,
        textarea {

            width: 100%;

            padding: 12px;

            border:
                1px solid
                #d5cec2;

            background: white;

            font-family: inherit;

            font-size: 14px;
        }

        textarea {

            min-height: 130px;

            resize: vertical;
        }

        input:focus,
        textarea:focus {

            outline: none;

            border-color:
                #b38d4d;
        }

        .arabic {

            direction: rtl;

            text-align: right;
        }

        .photo-area {

            display: flex;

            gap: 20px;

            align-items: flex-start;

            flex-wrap: wrap;
        }

        .photo-preview {

            width: 170px;

            height: 190px;

            object-fit: cover;

            border:
                1px solid
                #ddd5c8;

            display: none;

            background: #eee;
        }

        .photo-placeholder {

            width: 170px;

            height: 190px;

            background: #222;

            color: #c9a45c;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;

            font-weight: bold;
        }

        .photo-info {

            flex: 1;

            min-width: 250px;
        }

        .current-photo {

            margin-top: 10px;

            color: #777;

            font-size: 13px;
        }

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 25px;

            flex-wrap: wrap;
        }

        .primary-btn,
        .secondary-btn,
        .danger-btn {

            border: none;

            padding:
                13px
                22px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;
        }

        .primary-btn {

            background: #c9a45c;

            color: #171717;
        }

        .secondary-btn {

            background: #ddd6ca;

            color: #222;
        }

        .danger-btn {

            background: #9b2d2d;

            color: white;
        }

        .primary-btn:hover,
        .secondary-btn:hover,
        .danger-btn:hover {

            opacity: 0.85;
        }

        .status {

            margin-top: 15px;

            padding: 12px;

            display: none;
        }

        .success {

            display: block;

            background: #e5f2e8;

            color: #275b35;
        }

        .error {

            display: block;

            background: #f8e2e2;

            color: #8a2222;
        }

        .student-list {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 22px;
        }

        .student-item {

            background: #faf9f6;

            border:
                1px solid
                #ddd5c8;

            overflow: hidden;
        }

        .student-photo {

            width: 100%;

            height: 260px;

            object-fit: cover;

            background: #222;
        }

        .student-placeholder {

            height: 260px;

            background: #222;

            color: #c9a45c;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 60px;

            font-weight: bold;
        }

        .student-info {

            padding: 20px;
        }

        .student-info h4 {

            margin:
                0 0 5px;

            font-size: 22px;
        }

        .student-class {

            color: #9b7740;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 15px;
        }

        .student-quote {

            color: #666;

            font-style: italic;

            margin:
                12px 0;
        }

        .student-actions {

            display: flex;

            gap: 10px;

            margin-top: 18px;
        }

        .empty {

            padding: 30px;

            text-align: center;

            color: #777;
        }

        @media (max-width: 900px) {

            .student-list {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            .grid,
            .student-list {

                grid-template-columns: 1fr;
            }

            .full {

                grid-column: auto;
            }

            header {

                flex-direction: column;

                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<header>

    <div>

        <h1>
            BAS — Students Manager
        </h1>

        <p>
            Bashaer Science Magazine
        </p>

    </div>


    <div class="header-actions">

        <a href="/admin/dashboard.html">
            Dashboard
        </a>

        <a href="/admin/articles.html">
            Articles
        </a>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</header>


<main>


    <div class="top-title">

        <h2>
            Students
        </h2>

        <p>
            Manage the students who contribute to BAS Science Magazine.
        </p>

    </div>


    <section class="form-card">

        <h3 id="formTitle">
            Add New Student
        </h3>


        <div
            id="formMode"
            class="form-mode"
        >
            CREATE MODE
        </div>


        <form id="studentForm">


            <div class="grid">


                <div>

                    <label>
                        Student Name *
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>


                <div>

                    <label>
                        Class
                    </label>

                    <input
                        type="text"
                        id="class_name"
                        placeholder="Grade 8"
                    >

                </div>


                <div class="full">

                    <label>
                        Student Photo
                    </label>


                    <div class="photo-area">


                        <div>

                            <img
                                id="photoPreview"
                                class="photo-preview"
                                alt="Student photo"
                            >

                            <div
                                id="photoPlaceholder"
                                class="photo-placeholder"
                            >
                                BAS
                            </div>

                        </div>


                        <div class="photo-info">

                            <input
                                type="file"
                                id="photoFile"
                                accept="image/*"
                            >

                            <div
                                id="currentPhoto"
                                class="current-photo"
                            ></div>

                        </div>


                    </div>

                </div>


                <div>

                    <label>
                        English Biography
                    </label>

                    <textarea
                        id="biography_en"
                    ></textarea>

                </div>


                <div>

                    <label>
                        Arabic Biography
                    </label>

                    <textarea
                        id="biography_ar"
                        class="arabic"
                    ></textarea>

                </div>


                <div>

                    <label>
                        English Quote
                    </label>

                    <textarea
                        id="quote_en"
                        style="min-height:100px"
                    ></textarea>

                </div>


                <div>

                    <label>
                        Arabic Quote
                    </label>

                    <textarea
                        id="quote_ar"
                        class="arabic"
                        style="min-height:100px"
                    ></textarea>

                </div>


            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="primary-btn"
                    id="saveButton"
                >
                    Save Student
                </button>


                <button
                    type="button"
                    class="secondary-btn"
                    onclick="resetForm()"
                >
                    Clear / New Student
                </button>

            </div>


            <div
                id="statusMessage"
                class="status"
            ></div>


        </form>

    </section>


    <section class="list-card">

        <h3>
            Existing Students
        </h3>


        <div
            id="studentList"
            class="student-list"
        ></div>

    </section>


</main>


<script>


let editingId = null;

let currentPhotoUrl = "";


// ======================================
// AUTH
// ======================================

async function checkAuth() {

    const response =
        await fetch("/api/auth");

    const data =
        await response.json();

    if (!data.loggedIn) {

        window.location.href =
            "/admin/login.html";

    }

}


// ======================================
// LOGOUT
// ======================================

async function logout() {

    await fetch(
        "/api/logout",
        {
            method: "POST"
        }
    );

    window.location.href =
        "/admin/login.html";

}


// ======================================
// PHOTO PREVIEW
// ======================================

document
    .getElementById("photoFile")
    .addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file) {
                return;
            }

            const preview =
                document.getElementById(
                    "photoPreview"
                );

            const placeholder =
                document.getElementById(
                    "photoPlaceholder"
                );

            preview.src =
                URL.createObjectURL(file);

            preview.style.display =
                "block";

            placeholder.style.display =
                "none";

        }
    );


// ======================================
// UPLOAD PHOTO
// ======================================

async function uploadPhoto() {

    const fileInput =
        document.getElementById(
            "photoFile"
        );

    if (!fileInput.files.length) {

        return currentPhotoUrl || "";

    }

    const formData =
        new FormData();

    formData.append(
        "file",
        fileInput.files[0]
    );

    const response =
        await fetch(
            "/api/upload",
            {
                method: "POST",
                body: formData
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        throw new Error(
            data.message ||
            "Photo upload failed."
        );

    }

    return data.url;

}


// ======================================
// SAVE STUDENT
// ======================================

document
    .getElementById("studentForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const statusMessage =
                document.getElementById(
                    "statusMessage"
                );


            statusMessage.className =
                "status";

            statusMessage.textContent =
                "Saving...";


            try {

                const photoUrl =
                    await uploadPhoto();


                const studentData = {

                    name:
                        document.getElementById(
                            "name"
                        ).value.trim(),

                    class_name:
                        document.getElementById(
                            "class_name"
                        ).value.trim(),

                    photo:
                        photoUrl,

                    biography_en:
                        document.getElementById(
                            "biography_en"
                        ).value,

                    biography_ar:
                        document.getElementById(
                            "biography_ar"
                        ).value,

                    quote_en:
                        document.getElementById(
                            "quote_en"
                        ).value,

                    quote_ar:
                        document.getElementById(
                            "quote_ar"
                        ).value

                };


                let response;


                if (editingId) {

                    response =
                        await fetch(
                            `/api/students/${editingId}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        studentData
                                    )
                            }
                        );

                } else {

                    response =
                        await fetch(
                            "/api/students",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        studentData
                                    )
                            }
                        );

                }


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not save student."
                    );

                }


                statusMessage.className =
                    "status success";

                statusMessage.textContent =
                    editingId
                        ? "Student updated successfully."
                        : "Student created successfully.";


                resetForm();

                loadStudents();

            }

            catch(error) {

                console.error(error);

                statusMessage.className =
                    "status error";

                statusMessage.textContent =
                    error.message;

            }

        }
    );


// ======================================
// LOAD STUDENTS
// ======================================

async function loadStudents() {

    const response =
        await fetch(
            "/api/students"
        );

    const students =
        await response.json();

    const list =
        document.getElementById(
            "studentList"
        );

    list.innerHTML = "";


    if (!students.length) {

        list.innerHTML = `
            <div class="empty">
                No students yet.
            </div>
        `;

        return;

    }


    students.forEach(
        student => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "student-item";


            const photoHTML =
                student.photo

                    ? `
                        <img
                            src="${student.photo}"
                            class="student-photo"
                            alt=""
                        >
                    `

                    : `
                        <div class="student-placeholder">
                            BAS
                        </div>
                    `;


            item.innerHTML = `

                ${photoHTML}

                <div class="student-info">

                    <h4>
                        ${escapeHtml(
                            student.name || ""
                        )}
                    </h4>

                    ${
                        student.class_name
                            ? `
                                <div class="student-class">
                                    ${escapeHtml(
                                        student.class_name
                                    )}
                                </div>
                              `
                            : ""
                    }

                    ${
                        student.quote_en
                            ? `
                                <div class="student-quote">
                                    “${escapeHtml(
                                        student.quote_en
                                    )}”
                                </div>
                              `
                            : ""
                    }

                    <div class="student-actions">

                        <button
                            class="primary-btn"
                            onclick="editStudent(${student.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="danger-btn"
                            onclick="deleteStudent(${student.id})"
                        >
                            Delete
                        </button>

                    </div>

                </div>

            `;


            list.appendChild(item);

        }
    );

}


// ======================================
// EDIT STUDENT
// ======================================

async function editStudent(id) {

    const response =
        await fetch(
            "/api/students"
        );

    const students =
        await response.json();


    const student =
        students.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if (!student) {

        alert(
            "Student not found."
        );

        return;

    }


    editingId =
        student.id;


    currentPhotoUrl =
        student.photo || "";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Student";


    document.getElementById(
        "formMode"
    ).textContent =
        `EDIT MODE — Student #${student.id}`;


    document.getElementById(
        "saveButton"
    ).textContent =
        "Update Student";


    document.getElementById(
        "name"
    ).value =
        student.name || "";


    document.getElementById(
        "class_name"
    ).value =
        student.class_name || "";


    document.getElementById(
        "biography_en"
    ).value =
        student.biography_en || "";


    document.getElementById(
        "biography_ar"
    ).value =
        student.biography_ar || "";


    document.getElementById(
        "quote_en"
    ).value =
        student.quote_en || "";


    document.getElementById(
        "quote_ar"
    ).value =
        student.quote_ar || "";


    document.getElementById(
        "photoFile"
    ).value = "";


    const preview =
        document.getElementById(
            "photoPreview"
        );


    const placeholder =
        document.getElementById(
            "photoPlaceholder"
        );


    const currentPhoto =
        document.getElementById(
            "currentPhoto"
        );


    if (student.photo) {

        preview.src =
            student.photo;

        preview.style.display =
            "block";

        placeholder.style.display =
            "none";

        currentPhoto.textContent =
            "Current photo will be kept unless you choose a new one.";

    } else {

        preview.style.display =
            "none";

        placeholder.style.display =
            "flex";

        currentPhoto.textContent =
            "No current photo.";

    }


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ======================================
// DELETE STUDENT
// ======================================

async function deleteStudent(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this student?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/students/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Could not delete student."
            );

        }


        alert(
            "Student deleted successfully."
        );


        loadStudents();

    }

    catch(error) {

        alert(
            error.message
        );

    }

}


// ======================================
// RESET FORM
// ======================================

function resetForm() {

    editingId = null;

    currentPhotoUrl = "";


    document.getElementById(
        "studentForm"
    ).reset();


    document.getElementById(
        "formTitle"
    ).textContent =
        "Add New Student";


    document.getElementById(
        "formMode"
    ).textContent =
        "CREATE MODE";


    document.getElementById(
        "saveButton"
    ).textContent =
        "Save Student";


    document.getElementById(
        "photoPreview"
    ).style.display =
        "none";


    document.getElementById(
        "photoPlaceholder"
    ).style.display =
        "flex";


    document.getElementById(
        "currentPhoto"
    ).textContent =
        "";


    document.getElementById(
        "statusMessage"
    ).className =
        "status";

}


// ======================================
// ESCAPE HTML
// ======================================

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ======================================
// START
// ======================================

async function start() {

    await checkAuth();

    await loadStudents();

}


start();


</script>


</body>

</html>
