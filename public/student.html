<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BAS — Student</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">BAS</div>

    <div>

        <h1>Bashaer Science Magazine</h1>

        <p>A Student-Run Science Publication</p>

    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="archive.html">Archive</a>

        <a href="students.html">Students</a>

        <a href="admin/login.html">Admin</a>

    </nav>

</header>


<main>

<section class="section">

    <a href="students.html">
        ← Back to Students
    </a>


    <div id="student">

        Loading student...

    </div>

</section>


<section class="section">

    <p class="eyebrow">
        ARTICLES
    </p>

    <h2>
        Articles by this Student
    </h2>


    <div
        id="articles"
        class="cards"
    >

        Loading articles...

    </div>

</section>

</main>


<footer>

    <h3>BAS — Bashaer Science Magazine</h3>

    <p>A Student-Run Science Publication</p>

    <p>Elementary Cycle • Al Bashaer</p>

</footer>


<script>

async function loadStudent() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");


    const studentContainer =
        document.getElementById(
            "student"
        );

    const articlesContainer =
        document.getElementById(
            "articles"
        );


    if (!id) {

        studentContainer.innerHTML =
            "<h2>Student not found.</h2>";

        return;

    }


    try {

        const studentResponse =
            await fetch("/api/students");

        const students =
            await studentResponse.json();


        const student =
            students.find(
                item =>
                    Number(item.id)
                    === Number(id)
            );


        if (!student) {

            studentContainer.innerHTML =
                "<h2>Student not found.</h2>";

            return;

        }


        document.title =
            `${student.name} — BAS`;


        studentContainer.innerHTML = `

            <div
                style="
                    display:grid;
                    grid-template-columns:280px 1fr;
                    gap:50px;
                    align-items:start;
                    margin-top:40px;
                "
            >

                ${
                    student.photo
                    ?
                    `
                    <img
                        src="${student.photo}"
                        alt="${student.name}"
                        style="
                            width:100%;
                            height:350px;
                            object-fit:cover;
                        "
                    >
                    `
                    :
                    `
                    <div
                        class="student-placeholder"
                        style="height:350px;"
                    >

                        ${student.name
                            .charAt(0)
                            .toUpperCase()
                        }

                    </div>
                    `
                }


                <div>

                    <p class="eyebrow">
                        STUDENT SCIENTIST
                    </p>


                    <h2>
                        ${student.name}
                    </h2>


                    ${
                        student.class_name
                        ?
                        `
                        <p>
                            <strong>
                                Class:
                            </strong>

                            ${student.class_name}
                        </p>
                        `
                        :
                        ""
                    }


                    ${
                        student.biography_en
                        ?
                        `
                        <h3>
                            About
                        </h3>

                        <p>
                            ${student.biography_en}
                        </p>
                        `
                        :
                        ""
                    }


                    ${
                        student.biography_ar
                        ?
                        `
                        <p dir="rtl">

                            ${student.biography_ar}

                        </p>
                        `
                        :
                        ""
                    }


                    ${
                        student.quote_en
                        ?
                        `
                        <blockquote>

                            “${student.quote_en}”

                        </blockquote>
                        `
                        :
                        ""
                    }


                    ${
                        student.quote_ar
                        ?
                        `
                        <blockquote dir="rtl">

                            “${student.quote_ar}”

                        </blockquote>
                        `
                        :
                        ""
                    }

                </div>

            </div>

        `;


        const articleResponse =
            await fetch("/api/articles");

        const articles =
            await articleResponse.json();


        const studentArticles =
            articles.filter(
                article =>
                    Number(article.student_id)
                    === Number(student.id)
            );


        if (!studentArticles.length) {

            articlesContainer.innerHTML =
                "<p>This student has no published articles yet.</p>";

            return;

        }


        articlesContainer.innerHTML = "";


        studentArticles.forEach(article => {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "article-card";

            card.style.cursor =
                "pointer";


            card.innerHTML = `

                ${
                    article.main_image
                    ?
                    `
                    <img
                        src="${article.main_image}"
                        alt="${article.title_en}"
                    >
                    `
                    :
                    `
                    <div class="article-placeholder">
                        BAS
                    </div>
                    `
                }


                <div class="card-content">

                    <h3>
                        ${article.title_en}
                    </h3>


                    ${
                        article.title_ar
                        ?
                        `
                        <p dir="rtl">
                            ${article.title_ar}
                        </p>
                        `
                        :
                        ""
                    }


                    <p>
                        ${article.excerpt_en || ""}
                    </p>


                    <span class="button">
                        Read Article →
                    </span>

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    window.location.href =
                        `article.html?slug=${encodeURIComponent(article.slug)}`;

                }
            );


            articlesContainer.appendChild(card);

        });

    }

    catch (error) {

        console.error(error);

        studentContainer.innerHTML =
            "<p>Could not load student.</p>";

    }

}


loadStudent();

</script>

</body>

</html>
