<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover science through student-written stories, experiments, and questions from Al Bashaer High School.">
  <title>Welcome — BAS Science Magazine</title>
  <script>
    if (location.hash) location.replace("/index.html" + location.search + location.hash);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..800&amp;family=Fraunces:opsz,wght@9..144,500..800&amp;family=Noto+Naskh+Arabic:wght@500..700&amp;family=Noto+Sans+Arabic:wght@400..800&amp;display=swap">
  <link rel="stylesheet" href="/welcome.css?v=living-illustration">
  <script src="/editorial.js?v=orbiting-students" defer></script>
  <script src="/welcome.js?v=living-illustration" defer></script>
</head>
<body>
  <main class="welcome" aria-labelledby="welcome-title">
    <div class="welcome-copy">
      <header class="welcome-header">
        <div class="welcome-masthead">
          <span class="welcome-mark" lang="en" dir="ltr">BAS</span>
          <span data-en="Bashaer Science Magazine" data-ar="مجلة بشائر العلمية">Bashaer Science Magazine</span>
        </div>
        <div class="welcome-languages" role="group" data-language-group aria-label="Language">
          <button type="button" data-language="en" lang="en" aria-pressed="true">EN</button>
          <button type="button" data-language="ar" lang="ar" aria-pressed="false">العربية</button>
        </div>
      </header>

      <div class="welcome-story">
        <p class="welcome-kicker" data-en="Welcome to BAS" data-ar="أهلًا بكم في BAS">Welcome to BAS</p>
        <h1 id="welcome-title" data-en="Assalamu Alaikum!" data-ar="السلام عليكم!">Assalamu Alaikum!</h1>
        <p class="welcome-intro">
          <span data-en="Little questions. Wonderful discoveries." data-ar="أسئلة صغيرة. اكتشافات مدهشة.">Little questions. Wonderful discoveries.</span>
          <span data-en="Explore science through our students’ eyes." data-ar="استكشفوا العلم بعيون تلاميذنا.">Explore science through our students’ eyes.</span>
        </p>
        <div class="welcome-actions">
          <a class="welcome-enter" href="/index.html">
            <span data-en="Enter the magazine" data-ar="ادخلوا إلى المجلة">Enter the magazine</span>
          </a>
          <a class="welcome-issue" href="/index.html#latest" data-en="Explore Issue 1" data-ar="استكشفوا العدد الأول">Explore Issue 1</a>
        </div>
      </div>

      <footer class="welcome-footer">
        <span data-en="Al Bashaer High School" data-ar="ثانوية البشائر">Al Bashaer High School</span>
        <span data-en="Cycle 3" data-ar="الحلقة الثالثة">Cycle 3</span>
      </footer>
    </div>

    <div class="welcome-art">
      <video id="welcome-animation" aria-hidden="true" width="400" height="600" loop muted playsinline preload="none"
          poster="/images/bas-welcome-motion.webp">
        <source src="/images/bas-welcome-motion.mp4" type="video/mp4">
      </video>
      <button class="welcome-motion" type="button" aria-controls="welcome-animation" hidden
          data-en="Play animation" data-ar="شغّلوا الحركة">Play animation</button>
    </div>
  </main>
</body>
</html>
