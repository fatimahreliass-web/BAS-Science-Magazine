<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAS — Science Sections</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="editorial.css">
  <script src="skills-builder.js" defer></script>
  <script src="editorial.js" defer></script>
</head>
<body class="bas-editorial bas-category">
<header class="bas-header">
  <div class="bas-wrap bas-header-inner">
    <a class="bas-brand" href="index.html" aria-label="BAS">
      <img src="https://cdn.prod.website-files.com/5ab25784c7fcbff004fa8dca/66c737fdbff514bd3be9375f_Al%20Marrabat%20Al%20Kawthar%20school%20logo.webp" alt="Al Mabarrat Association" width="42" height="46">
      <span class="bas-wordmark" lang="en" dir="ltr">BAS</span>
      <span class="bas-brand-school" data-en="Al Bashaer High School" data-ar="ثانوية البشائر">Al Bashaer High School</span>
    </a>
    <nav class="bas-nav" aria-label="BAS">
      <a href="index.html#categories-showcase" aria-current='page' data-en="Sections" data-ar="الأقسام">Sections</a>
      <a href="index.html#latest" data-en="Articles" data-ar="المقالات">Articles</a>
      <a href="students.html" data-en="Students" data-ar="التلاميذ">Students</a>
      <a href="archive.html" data-en="Issues" data-ar="الأعداد">Issues</a>
      <a class="bas-nav-club" href="science-club.html" data-en="Science Club" data-ar="نادي العلوم">Science Club</a>
    </nav>
    <div class="bas-languages" aria-label="Language">
      <button type="button" data-language="en" lang="en">EN</button>
      <button type="button" data-language="ar" lang="ar">العربية</button>
    </div>
  </div>
</header>
<main class="bas-wrap">
  <section class="bas-page-intro">
    <a href="index.html#categories-showcase" data-en="All sections" data-ar="جميع الأقسام">All sections</a>
    <div id="categoryHeader"><h1 class="bas-status" data-en="Loading section…" data-ar="جارٍ تحميل القسم…">Loading section…</h1></div>
  </section>
  <div id="articles" class="bas-stories bas-category-stories"><p class="bas-status" data-en="Loading articles…" data-ar="جارٍ تحميل المقالات…">Loading articles…</p></div>
</main>
<script>
document.addEventListener("DOMContentLoaded", () => {
    basEditorial.initializeLanguage();
    loadCategory();
});

async function loadCategory() {
    const slug = new URLSearchParams(window.location.search).get("slug");
    const header = document.getElementById("categoryHeader");
    const container = document.getElementById("articles");
    try {
        const categories = await basEditorial.fetchList("/api/categories");
        const category = categories.find(item => item.slug === slug);
        if (!category) {
            basEditorial.status(header, "Section not found.", "القسم غير موجود.");
            container.replaceChildren();
            return;
        }

        const heading = basEditorial.localized(document.createElement("h1"), category.name_en, category.name_ar || category.name_en);
        document.title = heading.textContent + " — BAS";
        header.replaceChildren(heading);
        if (category.description_en || category.description_ar) {
            header.append(basEditorial.localized(
                document.createElement("p"),
                category.description_en || category.description_ar,
                category.description_ar || category.description_en
            ));
        }

        const articles = await basEditorial.fetchList("/api/articles");
        const selected = articles.filter(article => Number(article.category_id) === Number(category.id));
        if (!selected.length) {
            basEditorial.status(container, "No articles in this section yet.", "لا توجد مقالات في هذا القسم بعد.");
            return;
        }
        container.replaceChildren(...selected.map(basEditorial.articleCard));
    } catch (error) {
        console.error("Section could not be loaded", error);
        if (!header.querySelector("h1:not(.bas-status)")) {
            basEditorial.status(header, "Could not load section.", "تعذّر تحميل القسم.");
            container.replaceChildren();
        } else {
            basEditorial.status(container, "Could not load articles.", "تعذّر تحميل المقالات.");
        }
    }
}
</script>
<footer class="bas-footer">
  <div class="bas-wrap bas-footer-inner">
    <div><strong lang="en" dir="ltr">BAS</strong><p data-en="Bashaer Science School Magazine · Cycle 3" data-ar="مجلة بشائر العلمية · الحلقة الثالثة">Bashaer Science School Magazine · Cycle 3</p></div>
    <div class="bas-footer-links">
      <a href="index.html#editors-note" data-en="Editor’s Note" data-ar="كلمة المحرّر">Editor’s Note</a>
      <a href="archive.html" data-en="Archive" data-ar="الأرشيف">Archive</a>
      <a href="admin/login.html" data-en="Admin" data-ar="الإدارة">Admin</a>

    </div>
  </div>
</footer>
</body>
</html>
